name: Windows base signing input
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        default: v0.1.0
        type: string
      label:
        description: Artifact label
        default: development
        type: string
      unsigned_preview:
        description: Explicitly unsigned public experimental preview
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned unsigned base
        run: python tools/windows/build_base.py --package-sources
      - name: Verify license scope
        run: python tests/test_license_notices.py
      - name: Check object audio and haptic presentation
        timeout-minutes: 3
        run: |
          cmake --build build/windows-base-hosted --target object_audio_tracking_regression native_haptics_regression --parallel 4
          ctest --test-dir build/windows-base-hosted -R "^(object_audio_tracking_regression|native_haptics_regression)$" --output-on-failure --timeout 60 -V
      - name: Package explicitly selected unsigned artifact and corresponding sources
        shell: python
        env:
          AB2_RELEASE_VERSION: ${{ inputs.version }}
          AB2_RELEASE_LABEL: ${{ inputs.label }}
          AB2_UNSIGNED_PREVIEW: ${{ inputs.unsigned_preview }}
        run: |
          import os, subprocess
          mode = '--unsigned-preview' if os.environ['AB2_UNSIGNED_PREVIEW'] == 'true' else '--unsigned-signing-input'
          subprocess.run(['python', 'tools/package_windows_runtime.py', os.environ['AB2_RELEASE_VERSION'],
                          '--label', os.environ['AB2_RELEASE_LABEL'], '--profile', 'base',
                          '--build', 'build/windows-base-hosted', '--deps', 'build/windows-base-inputs', mode], check=True)
      # Trusted signing is a separate provider-controlled step. Public previews
      # require the explicit unsigned_preview dispatch input and stay labeled.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-base-UNSIGNED-signing-input
          if-no-files-found: error
          path: |
            build/releases/*.zip
            build/releases/*.sha256
            build/releases/*.manifest.json
            build/windows-base-hosted/pinned-inputs.json
            build/windows-base-hosted/unsigned-negative-control-*.json
